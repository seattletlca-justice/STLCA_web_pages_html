<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — STLCA</title>
<meta name="description" content="Search every page, finding, district, dashboard and case study on the STLCA site.">
<link rel="stylesheet" href="assets/stlca.css">
</head>
<body class="paper" data-page="search.html">

<main class="wrap">
  <div class="crumb"><a href="index.html">The Record</a> → Search</div>

  <div class="page-head" style="padding-bottom:0">
    <div class="eyebrow">Search</div>
    <h1>Search the record</h1>
  </div>

  <div class="search-shell">
    <label class="sr" for="q-big">Search query</label>
    <input id="q-big" type="search" placeholder="Try: inspection date, district 3, RRIO, closure, denominator…" autocomplete="off">
    <div class="filters" id="filters"></div>
    <p class="chart-sub" id="count"></p>
    <div class="results" id="results"></div>
  </div>

  <div class="prov" id="prov"></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/stlca.js"></script>
<script>
(function () {
  var S = window.STLCA, D = S.data;
  var input = document.getElementById("q-big");
  var results = document.getElementById("results");
  var countEl = document.getElementById("count");
  var active = [];

  var kinds = [];
  D.search.forEach(function (e) { if (kinds.indexOf(e.kind) === -1) kinds.push(e.kind); });
  document.getElementById("filters").innerHTML = kinds.map(function (k) {
    return '<button type="button" data-kind="' + S.esc(k) + '" aria-pressed="false">' + S.esc(k) + "</button>";
  }).join("");

  document.getElementById("filters").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    var k = b.getAttribute("data-kind"), i = active.indexOf(k);
    if (i === -1) { active.push(k); b.setAttribute("aria-pressed", "true"); }
    else { active.splice(i, 1); b.setAttribute("aria-pressed", "false"); }
    render();
  });

  function render() {
    var q = input.value.trim();
    var hits = S.search(q, active);
    countEl.textContent = hits.length + (hits.length === 1 ? " result" : " results") +
      (q ? ' for "' + q + '"' : "") + (active.length ? " in " + active.join(", ") : "") +
      " · " + D.search.length + " pages and figures indexed";

    results.innerHTML = hits.length ? hits.map(function (h) {
      var e = h.e;
      return '<div class="hit-row"><a href="' + e.url + '">' + S.esc(e.title) + "</a>" +
        '<span class="kind">' + S.esc(e.kind) + "</span>" +
        "<p>" + (q ? S.highlight(e.text, q) : S.esc(e.text.slice(0, 200))) + "…</p></div>";
    }).join("") : '<p style="color:var(--ink-2)">Nothing matched. Every term has to appear ' +
      "somewhere in the page's title, summary or tags.</p>";

    var url = new URL(location.href);
    if (q) url.searchParams.set("q", q); else url.searchParams.delete("q");
    history.replaceState(null, "", url);
  }

  input.addEventListener("input", render);
  var seed = new URLSearchParams(location.search).get("q");
  if (seed) input.value = seed;
  render();
  input.focus();

  document.getElementById("prov").innerHTML =
    "<b>Index</b> " + D.search.length + " entries, generated by build.py from the data layer<br>" +
    "<b>Coverage</b> pages, findings, districts, dashboards and case studies, including their " +
    "headline figures and claim boundaries<br><b>Data layer built</b> " + D.generated;
})();
</script>
</body>
</html>
